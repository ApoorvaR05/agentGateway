version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: sentinel_postgres
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_pass
      POSTGRES_DB: proddb
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: sentinel_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: vault server -dev

  iam_mock:
    build:
      context: ./infra/iam_mock
    container_name: sentinel_iam
    ports:
      - "8300:8300"

  redis:
    image: redis:7
    container_name: sentinel_redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: sentinel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  default:
    name: sentinel_net
